<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智车养护 - 选择服务</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* 全局滚动条隐藏 */
    ::-webkit-scrollbar {
      display: none !important;
    }
    
    * {
      -ms-overflow-style: none !important;  /* IE and Edge */
      scrollbar-width: none !important;  /* Firefox */
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9ff;
      color: #1f2937;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 50;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #1f2937;
      transition: all 0.2s ease;
    }
    
    .back-button:active {
      background: #e5e7eb;
      transform: scale(0.95);
    }
    
    .search-container {
      position: relative;
      margin: 16px 20px;
    }
    
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 12px;
      border: none;
      background-color: #f3f4f6;
      font-size: 14px;
      color: #1f2937;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 16px;
    }
    
    .main-content {
      padding: 0 20px 120px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 24px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .see-all {
      font-size: 14px;
      font-weight: 500;
      color: #3b82f6;
    }
    
    .category-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0;
      margin: 0 -20px;
      padding-left: 20px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    .category-scroll::-webkit-scrollbar {
      display: none;
    }
    
    .category-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 72px;
    }
    
    .category-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      color: #3b82f6;
    }
    
    .category-name {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      color: #4b5563;
    }
    
    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    
    .service-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease;
    }
    
    .service-card:active {
      transform: scale(0.98);
    }
    
    .service-image {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }
    
    .service-details {
      padding: 12px;
    }
    
    .service-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1f2937;
    }
    
    .service-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    
    .service-time {
      font-size: 12px;
      color: #6b7280;
      display: flex;
      align-items: center;
    }
    
    .service-price {
      font-size: 16px;
      font-weight: 600;
      color: #ef4444;
    }
    
    .service-tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .promotion-banner {
      margin: 24px 0;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 16px;
      padding: 16px;
      color: white;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    
    .promotion-content {
      flex: 1;
      z-index: 10;
    }
    
    .promotion-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .promotion-description {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 12px;
    }
    
    .promotion-button {
      display: inline-block;
      padding: 8px 16px;
      background: white;
      color: #2563eb;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    
    .promotion-image {
      width: 100px;
      height: 100px;
      object-fit: contain;
      position: relative;
      z-index: 10;
    }
    
    .promotion-banner::before {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .promotion-banner::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: 30px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-evenly;
      padding: 12px 0 25px;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
      z-index: 50;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      color: #9ca3af;
      text-decoration: none;
    }
    
    .nav-item.active {
      color: #3b82f6;
    }
    
    .nav-text {
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- Header with back button -->
  <div class="header">
    <div class="w-9"></div> <!-- Left spacer for centered title -->
    <h1 class="text-lg font-semibold">选择服务</h1>
    <div class="w-9"></div> <!-- Right spacer for centered title -->
  </div>
  
  <!-- Search bar -->
  <div class="search-container">
    <i class="fas fa-search search-icon"></i>
    <input type="text" class="search-input" placeholder="搜索服务项目">
  </div>
  
  <div class="main-content">
    <!-- Service categories -->
    <h2 class="section-title">
      <span>服务分类</span>
      <a href="#" class="see-all">查看全部</a>
    </h2>
    
    <div class="category-scroll">
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-car"></i>
        </div>
        <div class="category-name">洗车服务</div>
      </div>
      
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-oil-can"></i>
        </div>
        <div class="category-name">保养维修</div>
      </div>
      
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-spray-can"></i>
        </div>
        <div class="category-name">美容装饰</div>
      </div>
      
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-cog"></i>
        </div>
        <div class="category-name">轮胎服务</div>
      </div>
      
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-tachometer-alt"></i>
        </div>
        <div class="category-name">检测调整</div>
      </div>
      
      <div class="category-item">
        <div class="category-icon">
          <i class="fas fa-battery-full"></i>
        </div>
        <div class="category-name">电瓶服务</div>
      </div>
    </div>
    
    <!-- Promotion banner -->
    <div class="promotion-banner">
      <div class="promotion-content">
        <div class="promotion-title">新用户专享</div>
        <div class="promotion-description">首次消费满100元立减30元</div>
        <a href="#" class="promotion-button">立即领取</a>
      </div>
      <div style="width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; z-index: 1;">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2z"/>
          <circle cx="12" cy="10" r="3"/>
          <path d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8z"/>
        </svg>
      </div>
    </div>
    
    <!-- Popular services -->
    <h2 class="section-title">
      <span>热门服务</span>
      <a href="#" class="see-all">查看全部</a>
    </h2>
    
    <div class="service-grid">
      <a href="appointment-time.html?service=标准洗车" class="service-card">
        <div class="service-image" style="background-color: #e6f2ff; display: flex; align-items: center; justify-content: center; height: 130px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2V5H3v12h2"></path>
            <path d="M14 17H8"></path>
            <path d="M5 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0zm10 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0z"></path>
          </svg>
        </div>
        <div class="service-details">
          <div class="service-title">标准洗车</div>
          <div class="service-tag">热门</div>
          <div class="service-meta">
            <div class="service-time">
              <i class="far fa-clock mr-1"></i> 30分钟
            </div>
            <div class="service-price">¥39.9</div>
          </div>
        </div>
      </a>
      
      <a href="appointment-time.html?service=精致洗车" class="service-card">
        <div class="service-image" style="background-color: #e6f7ff; display: flex; align-items: center; justify-content: center; height: 130px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"></path>
            <rect x="7" y="10" width="4" height="8" rx="1"></rect>
            <rect x="15" y="5" width="4" height="13" rx="1"></rect>
          </svg>
        </div>
        <div class="service-details">
          <div class="service-title">精致洗车</div>
          <div class="service-tag">推荐</div>
          <div class="service-meta">
            <div class="service-time">
              <i class="far fa-clock mr-1"></i> 45分钟
            </div>
            <div class="service-price">¥59.9</div>
          </div>
        </div>
      </a>
      
      <a href="appointment-time.html?service=机油更换" class="service-card">
        <div class="service-image" style="background-color: #fff7e6; display: flex; align-items: center; justify-content: center; height: 130px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 8l-3 3-3-3"></path>
            <path d="M6 5v6"></path>
            <path d="M13 12h5a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2z"></path>
            <path d="M20 14v4a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2v-4"></path>
          </svg>
        </div>
        <div class="service-details">
          <div class="service-title">机油更换</div>
          <div class="service-tag">保养</div>
          <div class="service-meta">
            <div class="service-time">
              <i class="far fa-clock mr-1"></i> 60分钟
            </div>
            <div class="service-price">¥199</div>
          </div>
        </div>
      </a>
      
      <a href="appointment-time.html?service=轮胎更换" class="service-card">
        <div class="service-image" style="background-color: #ffe6e6; display: flex; align-items: center; justify-content: center; height: 130px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
          </svg>
        </div>
        <div class="service-details">
          <div class="service-title">轮胎更换</div>
          <div class="service-tag">安全</div>
          <div class="service-meta">
            <div class="service-time">
              <i class="far fa-clock mr-1"></i> 90分钟
            </div>
            <div class="service-price">¥328</div>
          </div>
        </div>
      </a>
    </div>
  </div>
  
  <!-- Bottom navigation -->
  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <i class="fas fa-home"></i>
      <div class="nav-text">首页</div>
    </a>
    
    <a href="appointment-service.html" class="nav-item active">
      <i class="fas fa-car"></i>
      <div class="nav-text">服务</div>
    </a>
    
    <a href="order-list.html" class="nav-item">
      <i class="fas fa-list-alt"></i>
      <div class="nav-text">订单</div>
    </a>
    
    <a href="my-profile.html" class="nav-item">
      <i class="fas fa-user"></i>
      <div class="nav-text">我的</div>
    </a>
  </div>
  
  <script>
    // 添加点击提示功能
    document.querySelectorAll('.see-all, .promotion-button, .category-item').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        alert('该功能正在开发中');
      });
    });
  </script>
</body>
</html>
