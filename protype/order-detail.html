<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智车养护 - 订单详情</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* 全局滚动条隐藏 */
    ::-webkit-scrollbar {
      display: none !important;
    }
    
    * {
      -ms-overflow-style: none !important;  /* IE and Edge */
      scrollbar-width: none !important;  /* Firefox */
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9ff;
      color: #1f2937;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 50;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #1f2937;
      transition: all 0.2s ease;
    }
    
    .back-button:active {
      background: #e5e7eb;
      transform: scale(0.95);
    }
    
    .status-color {
      background-color: #f59e0b; /* 待到店状态颜色 */
      padding: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .main-content {
      padding: 0 20px 100px;
    }
    
    .progress-node {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .progress-line {
      position: absolute;
      height: 2px;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 1;
    }
    
    .progress-complete {
      background-color: #3b82f6;
      border: 2px solid #3b82f6;
      color: white;
    }
    
    .progress-current {
      background-color: white;
      border: 2px solid #3b82f6;
      color: #3b82f6;
      font-weight: bold;
    }
    
    .progress-future {
      background-color: white;
      border: 2px solid #9ca3af;
      color: #9ca3af;
    }
    
    .progress-line-complete {
      background-color: #3b82f6;
    }
    
    .progress-line-future {
      background-color: #d1d5db;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin-bottom: 16px;
    }
    
    .card-title {
      background-color: #f3f4f6;
      padding: 12px 16px;
      font-weight: 600;
      color: #4b5563;
    }
    
    .card-content {
      padding: 16px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: #6b7280;
    }
    
    .info-value {
      font-weight: 500;
    }
    
    .info-value.highlight {
      color: #ef4444;
      font-weight: 600;
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-evenly;
      padding: 12px 0 25px;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      color: #9ca3af;
      text-decoration: none;
    }
    
    .nav-item.active {
      color: #3b82f6;
    }
    
    .nav-text {
      font-size: 12px;
      margin-top: 4px;
    }
    
    .action-button {
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      background: #ef4444;
      color: white;
      transition: all 0.2s;
    }
    
    .action-button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="header">
    <a href="order-list.html" class="back-button">
      <i class="fas fa-chevron-left"></i>
    </a>
    <h1 class="text-lg font-semibold">订单详情</h1>
    <div class="w-9"></div> <!-- 右侧占位 -->
  </div>

  <!-- 状态区 -->
  <div class="status-color">
    <h2 class="text-white text-2xl font-bold">待到店</h2>
  </div>

  <!-- 进度条组件 -->
  <div class="bg-white p-6 mb-4">
    <div class="flex relative justify-between">
      <!-- 连接线 -->
      <div class="progress-line progress-line-complete w-1/3 left-0"></div>
      <div class="progress-line progress-line-future w-2/3 right-0"></div>
      
      <!-- 节点 -->
      <div class="flex flex-col items-center z-10">
        <div class="progress-node progress-complete">
          <i class="fas fa-check text-xs"></i>
        </div>
        <span class="text-xs mt-2 font-medium">待到店</span>
        <span class="text-xs text-gray-500">08:30</span>
      </div>
      
      <div class="flex flex-col items-center z-10">
        <div class="progress-node progress-current"></div>
        <span class="text-xs mt-2 font-medium">等待服务</span>
        <span class="text-xs text-gray-500">--:--</span>
      </div>
      
      <div class="flex flex-col items-center z-10">
        <div class="progress-node progress-future"></div>
        <span class="text-xs mt-2 text-gray-500">洗车中</span>
        <span class="text-xs text-gray-500">--:--</span>
      </div>
      
      <div class="flex flex-col items-center z-10">
        <div class="progress-node progress-future"></div>
        <span class="text-xs mt-2 text-gray-500">可取车</span>
        <span class="text-xs text-gray-500">--:--</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <!-- 订单信息区域 -->
    <div class="card">
      <div class="card-title">订单信息</div>
      <div class="card-content">
        <div class="info-row">
          <div class="info-label">订单号</div>
          <div class="info-value">WX20231125001</div>
        </div>
        <div class="info-row">
          <div class="info-label">下单时间</div>
          <div class="info-value">2023-11-25 08:30</div>
        </div>
        <div class="info-row">
          <div class="info-label">车牌号</div>
          <div class="info-value">粤A12345</div>
        </div>
        <div class="info-row">
          <div class="info-label">服务项目</div>
          <div class="info-value">精致洗车</div>
        </div>
        <div class="info-row">
          <div class="info-label">金额</div>
          <div class="info-value highlight">¥68.00</div>
        </div>
      </div>
    </div>

    <!-- 门店信息区域 -->
    <div class="card">
      <div class="card-title">门店信息</div>
      <div class="card-content">
        <div class="info-row">
          <div class="info-label">门店地址</div>
          <div class="info-value text-right">广州市天河区天河路385号</div>
        </div>
        <div class="info-row">
          <div class="info-label">联系电话</div>
          <a href="tel:020-12345678" class="info-value text-blue-500">020-12345678</a>
        </div>
      </div>
    </div>

    <!-- 底部按钮 -->
    <div class="fixed bottom-6 left-0 right-0 p-4 bg-white">
      <button class="action-button">
        取消订单
      </button>
    </div>
  </div>
  
  <script>
    // 添加点击提示功能
    document.querySelector('.action-button').addEventListener('click', function(e) {
      e.preventDefault();
      alert('取消订单功能正在开发中');
    });
  </script>
</body>
</html>
